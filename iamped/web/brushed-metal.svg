<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512">
  <!-- Procedural brushed aluminum: fractal noise stretched into long horizontal
       streaks, desaturated and compressed into a narrow band of light grays. -->
  <filter id="m" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.006 0.9" numOctaves="5" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.42" intercept="0.54"/>
      <feFuncG type="linear" slope="0.42" intercept="0.54"/>
      <feFuncB type="linear" slope="0.42" intercept="0.54"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" filter="url(#m)"/>
</svg>
